name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    uses: ./.github/workflows/ai-review-reusable.yml
    with:
      # 이 레포의 PR은 PR 브랜치의 리뷰 스크립트로 리뷰 (스크립트 변경을 PR 안에서 바로 검증)
      reviewer-ref: ${{ github.event.pull_request.head.sha }}
    secrets:
      AI_REVIEW_API_KEY: ${{ secrets.AI_REVIEW_API_KEY }}
