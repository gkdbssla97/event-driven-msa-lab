name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # 테스트가 필요로 하는 MySQL/Redis는 Testcontainers가 실행 중에 직접 띄운다.
    # (GitHub Actions ubuntu 러너에는 Docker가 기본 제공되어 별도 service 블록이 필요 없다.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
