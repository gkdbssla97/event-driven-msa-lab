services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orbstack
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:9092

  # order-service 전용 MySQL (설계 원칙: 서비스 경계를 저장소로도 분리)
  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orderdb
      MYSQL_USER: order
      MYSQL_PASSWORD: orderpass
    volumes:
      - mysql-order-data:/var/lib/mysql

  # payment-service 전용 MySQL
  mysql-payment:
    image: mysql:8.0
    container_name: mysql-payment
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: paymentdb
      MYSQL_USER: payment
      MYSQL_PASSWORD: paymentpass
    volumes:
      - mysql-payment-data:/var/lib/mysql

volumes:
  mysql-order-data:
  mysql-payment-data:
