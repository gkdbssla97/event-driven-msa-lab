            - name: MYSQL_DATABASE
              value: paymentdb
            - name: MYSQL_USER
              value: payment
            - name: MYSQL_PASSWORD
              value: paymentpass
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
            initialDelaySeconds: 20
