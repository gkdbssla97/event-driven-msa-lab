spring:
  application:
    name: inventory-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # app.inventory.store=jdbc일 때만 사용된다 (기본 redis 모드에서는 무시).
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3308}/inventorydb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:inventory}
    password: ${DB_PASSWORD:inventorypass}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8084

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

app:
  kafka:
    topics:
      order-created: order-created
      payment-failed: payment-failed
      inventory-reserved: inventory-reserved
      inventory-failed: inventory-failed
      order-created-dlq: order-created.DLQ
  inventory:
    # 재고 저장소 백엔드: redis(기본, Lua 원자성) | jdbc(RDB 조건부 UPDATE 원자성)
    store: ${INVENTORY_STORE:redis}
    initial-stock: 100
