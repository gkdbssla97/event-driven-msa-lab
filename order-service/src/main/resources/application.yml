spring:
  application:
    name: order-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:order}
    password: ${DB_PASSWORD:orderpass}
  jpa:
    hibernate:
      # 인메모리 create-drop이 아니라 update — 재시작해도 Outbox 이벤트가 살아남아야
      # Outbox 패턴의 "발행 보장(내구성)" 전제가 성립한다.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate.format_sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db

app:
  kafka:
    topics:
      order-created: order-created
      payment-completed: payment-completed
      payment-failed: payment-failed
      inventory-failed: inventory-failed
  outbox:
    # 발행 대상 선점 전략: skip-locked(기본, 병렬) | shedlock(분산 락, 직렬화)
    strategy: ${OUTBOX_STRATEGY:skip-locked}
    batch-size: 100
