spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/paymentdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER:payment}
    password: ${DB_PASSWORD:paymentpass}
  jpa:
    hibernate:
      # PaymentRecord(멱등성 원장)는 재시작해도 남아있어야 중복 결제 차단이 유지된다.
      ddl-auto: update
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db

app:
  kafka:
    topics:
      inventory-reserved: inventory-reserved
      payment-completed: payment-completed
      payment-failed: payment-failed
      order-created-dlq: order-created.DLQ
  payment:
    # 실제 상품 카탈로그가 없어 quantity당 고정 단가로 원장 금액을 계산한다 (ledger-lite 스코프).
    unit-price-krw: ${PAYMENT_UNIT_PRICE_KRW:10000}
